{{- $database := .Values.timescaledb -}}
{{- if not $database.auth.existingSecret -}}
{{- $host := ternary (printf "%s-timescaledb-svc" (include "analytics.fullname" .)) $database.auth.host $database.builtin -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "analytics.fullname" . }}-timescaledb-connection-secret
  labels:
    {{- include "analytics.labels" . | nindent 4 }}
type: Opaque
data:
  dbname: {{ $database.auth.database | b64enc | quote }}
  host: {{ $host | b64enc | quote }}
  password: {{ $database.auth.password | b64enc | quote }}
  port: {{ $database.auth.port | b64enc | quote }}
  user: {{ $database.auth.username | b64enc | quote }}
  connection_url: {{ printf "postgresql://%s:%s@%s:%v/%s"
        ($database.auth.username | urlquery)
        ($database.auth.password | urlquery)
        $host
        $database.auth.port
        ($database.auth.database | urlquery)
      | b64enc | quote }}
{{- end }}
