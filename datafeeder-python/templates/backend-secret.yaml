{{- $webapp := .Values.backend -}}
{{- if $webapp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datafeeder-python.fullname" . }}-backend-secret
  labels:
    {{- include "datafeeder-python.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ $webapp.config.secretKey | b64enc | quote }}
  ENCRYPTION_KEY:  {{ $webapp.config.encryptionKey | b64enc | quote }}
  GEOSERVER_USER: {{ $webapp.config.geoserver.username | b64enc | quote }}
  GEOSERVER_PASSWORD: {{ $webapp.config.geoserver.password | b64enc | quote }}
  GEONETWORK_USERNAME: {{ $webapp.config.geonetwork.username | b64enc | quote }}
  GEONETWORK_PASSWORD: {{ $webapp.config.geonetwork.password  | b64enc | quote }}
  AIRFLOW_USERNAME: {{ $webapp.config.airflow.username | b64enc | quote }}
  AIRFLOW_PASSWORD: {{ $webapp.config.airflow.password  | b64enc | quote }}

{{- end }}
