{{- $webapp := .Values.backend -}}
{{- if $webapp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datafeeder-python.fullname" . }}-backend-secret
  labels:
    {{- include "datafeeder-python.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ required "backend.config.secretKey is required" $webapp.config.secretKey | b64enc | quote }}
  ENCRYPTION_KEY:  {{ required "backend.config.encryptionKey is required" $webapp.config.encryptionKey | b64enc | quote }}
  GEOSERVER_USER: {{ required "backend.config.geoserver.username is required" $webapp.config.geoserver.username | b64enc | quote }}
  GEOSERVER_PASSWORD: {{ required "backend.config.geoserver.password is required" $webapp.config.geoserver.password | b64enc | quote }}
  GEONETWORK_USERNAME: {{ required "backend.config.geonetwork.username is required" $webapp.config.geonetwork.username | b64enc | quote }}
  GEONETWORK_PASSWORD: {{ required "backend.config.geonetwork.password is required" $webapp.config.geonetwork.password  | b64enc | quote }}
  AIRFLOW_USERNAME: {{ required "backend.config.airflow.username is required" $webapp.config.airflow.username | b64enc | quote }}
  AIRFLOW_PASSWORD: {{ required "backend.config.airflow.password is required" $webapp.config.airflow.password  | b64enc | quote }}
{{- end }}
