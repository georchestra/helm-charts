{{- $webapp := .Values.backend -}}
{{- if $webapp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datafeeder-python.fullname" . }}-backend-secret
  labels:
    {{- include "datafeeder-python.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with $webapp.config.geoserver.username }}
  GEOSERVER_USERNAME: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $webapp.config.geoserver.password }}
  GEOSERVER_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $webapp.config.geonetwork.username }}
  GEONETWORK_USERNAME: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $webapp.config.geonetwork.password }}
  GEONETWORK_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $webapp.config.airflow.username }}
  AIRFLOW_USERNAME: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $webapp.config.airflow.password }}
  AIRFLOW_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
